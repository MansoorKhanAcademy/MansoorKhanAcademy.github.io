<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dough Dai - Online Menu | Dargai Bazar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Jost:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--black:#121212;--gold:#ffb300}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#222}
.hero{background:linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.88)),url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=2070');background-size:cover;background-position:center;color:#fff;padding:35px 18px 45px;text-align:center;border-bottom:5px solid var(--gold)}
.hero img.logo{width:130px;height:130px;object-fit:cover;border-radius:50%;border:4px solid var(--gold);box-shadow:0 8px 25px rgba(0,0,0,.5);background:#fff}
.hero h1{font-family:'Jost',sans-serif;font-size:44px;font-weight:800;margin-top:10px}
.hero h1 span{color:var(--gold)}
.hero p{opacity:.9;margin-top:6px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badge{background:rgba(255,255,255,.15);padding:7px 13px;border-radius:30px;font-size:13px;border:1px solid rgba(255,255,255,.2)}
.container{max-width:1100px;margin:-20px auto 0;padding:0 12px 130px;position:relative;z-index:2}
.cat{margin:34px 0 12px}
.cat-title{background:#121212;color:#fff;display:inline-block;padding:8px 20px;border-radius:8px;font-family:'Jost',sans-serif;font-size:22px;font-weight:800;border-left:6px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:12px;margin-top:10px}
.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 6px 18px rgba(0,0,0,.12);border:1px solid #eee}
.top{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:700;font-size:15px}
.price{color:var(--red);font-weight:800;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:11px;align-items:center}
.qty{display:flex;align-items:center;background:#f5f5f5;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.qty button{width:32px;height:36px;border:none;background:#eee;font-weight:700;font-size:18px;cursor:pointer}
.qty input{width:42px;height:36px;border:none;text-align:center;font-weight:700;outline:none}
.btn-wa{flex:1;background:#25D366;color:#fff;border:none;padding:9px;border-radius:8px;font-weight:700;cursor:pointer}
.pizza-table{width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);border-collapse:collapse;margin-top:10px}
.pizza-table th{background:#121212;color:#fff;padding:9px;text-align:left;font-size:13px}
.pizza-table td{padding:8px;border-bottom:1px solid #eee;font-size:13px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:99}
.cart-info{flex:1}
.btn-all{background:#121212;color:#fff;border:none;padding:13px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-all:disabled{opacity:.4}
</style>
</head>
<body>
<div class="hero">
<img src="logo.png" alt="Dough Dai Logo" class="logo" onerror="this.style.display='none'">
<h1>Dough <span>Dai</span></h1>
<p>📍 Tariq Market, Adjacent PTCL Exchange, Dargai Bazar</p>
<div class="badges"><div class="badge">📞 PTCL: 0932-332665</div><div class="badge">📱 0302-1591111</div><div class="badge">🚚 Free Delivery in Dargai</div></div>
</div>
<div class="container" id="root"></div>
<div class="sticky">
<div class="cart-info"><b id="count">0 Items</b><br><span id="list" style="font-size:12px;color:#666">Koi item select nahi</span></div>
<button class="btn-all" id="orderAll" onclick="orderAll()" disabled>WhatsApp Par Full Order</button>
</div>
<script>
const WA="923021591111";
const pizzas=[["Dough Dai Special",650,1200,1800],["Chicken Tikka",550,1050,1500],["Chicken Fajita",550,1050,1500],["Creamy Melt",600,1100,1600],["Beef Pepperoni",600,1150,1650],["Margherita",450,850,1350],["Stuffed Crust",null,1200,1650],["Kebab Crust",null,1250,1700],["Crown Crust",null,1350,1750],["Calzone (Single)",null,1200,null]];
const menus={"STARTERS":[["Wings (6 Pcs)",450],["Bihari Roll",350],["Loaded Fries",450],["Fries",150],["Soup Special",350],["Chicken Corn Soup",250]],"PIZZA TOPPINGS":[["Extra Topping 7 inch",150],["Extra Topping 10 inch",200],["Extra Topping 13 inch",300]],"BURGERS":[["Dough Dai Grill Burger",420],["Dough Dai Crunch Classic",450],["Dough Dai Crunch Nashville",490],["Smash Burger",600],["The Big Boss",650]],"WRAPS & SANDWICHES":[["Dough Dai Grilled Wrap",420],["Dough Dai Crispy Wrap",450],["Dough Dai Sandwich Crispy",500],["Dough Dai Sandwich Jalapeño",500]],"DOUGH DAI CLASSICS":[["Alfredo Pasta",600],["Marinara Pasta",600],["Mac & Cheese with Tenders",650],["Fish & Chips",850]],"KIDS MENU":[["Kids Burger",350],["Dough Dai Poppers",350],["Wings (4 piece)",350]],"CHICKEN":[["Crispy Chicken 2 pcs",450],["Crispy Chicken 4 pcs",950],["Crispy Chicken 6 pcs",1200],["Crispy Chicken 8 pcs",1600],["Chicken Tenders 3 pcs",450],["Chicken Tenders 6 pcs",850]],"ADD-ONS":[["Smash Patty",250],["Cheese",60],["Mushrooms",60],["Grilled Onions",50],["BBQ Sauce",50],["Garlic Mayo",50],["Dough Dai Special Sauce",70]]};
function chg(b,d){let i=b.parentElement.querySelector('input');let v=parseInt(i.value)||1;v+=d;if(v<1)v=1;i.value=v;update();}
function cardHTML(name,price){return `<div class="card" data-name="${name}" data-price="${price}"><div class="top"><div class="name">${name}</div></div><div class="price">Rs ${price}</div><div class="actions"><div class="qty"><button onclick="chg(this,-1)">-</button><input type="number" value="1" min="1" oninput="update()"><button onclick="chg(this,1)">+</button></div><button class="btn-wa" onclick="orderOne(this)">WhatsApp</button></div></div>`;}
let html='';html+=`<div class="cat"><div class="cat-title">PIZZA MENU</div><table class="pizza-table" id="pt"><tr><th>Pizza Name</th><th>7" Price</th><th>10" Price</th><th>13" Price</th></tr></table></div>`;
for(let k in menus){html+=`<div class="cat"><div class="cat-title">${k}</div><div class="grid">`;menus[k].forEach(m=>{html+=cardHTML(m[0],m[1]);});html+=`</div></div>`;}
document.getElementById('root').innerHTML=html;
const pt=document.getElementById('pt');
pizzas.forEach(p=>{let row=document.createElement('tr');let tds=`<td><b>${p[0]}</b></td>`;[[p[1],'7"'],[p[2],'10"'],[p[3],'13"']].forEach(s=>{if(s[0]) tds+=`<td><b style="color:#c8102e">Rs ${s[0]}</b><div class="qty" style="margin-top:6px"><button onclick="chg(this,-1)">-</button><input data-pizza="${p[0]} ${s[1]}" data-price="${s[0]}" type="number" value="1"><button onclick="chg(this,1)">+</button></div><button class="btn-wa" style="margin-top:6px;width:100%" onclick="orderPizza('${p[0]} ${s[1]}',${s[0]},this)">Order ${s[1]}</button></td>`;else tds+=`<td>-</td>`;});row.innerHTML=tds;pt.appendChild(row);});
function update(){let cart=[];document.querySelectorAll('.card').forEach(c=>{let q=parseInt(c.querySelector('input').value)||0;if(q>0)cart.push({n:c.dataset.name,p:parseInt(c.dataset.price),q});});document.querySelectorAll('#pt input').forEach(i=>{let q=parseInt(i.value)||0;if(q>0)cart.push({n:i.dataset.pizza,p:parseInt(i.dataset.price),q});});window._cart=cart;let totalQty=cart.reduce((a,b)=>a+b.q,0);document.getElementById('count').innerText=totalQty+' Items';if(cart.length){document.getElementById('list').innerText=cart.map(c=>c.n+' x'+c.q).join(', ');document.getElementById('orderAll').disabled=false;}else{document.getElementById('list').innerText='Koi item select nahi';document.getElementById('orderAll').disabled=true;}}
function orderOne(b){let c=b.closest('.card');let n=c.dataset.name;let p=c.dataset.price;let q=c.querySelector('input').value;let msg=`Assalam-o-Alaikum Dough Dai!%0AOrder: ${n} x ${q} = Rs ${p*q}%0AName:%0APhone:%0AAddress:`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');}
function orderPizza(name,price,btn){let q=btn.parentElement.querySelector('input').value;let msg=`Assalam-o-Alaikum Dough Dai!%0AOrder: ${name} x ${q} = Rs ${price*q}%0AName:%0APhone:%0AAddress:`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');}
function orderAll(){let cart=window._cart||[];if(!cart.length)return;let total=0;let lines=cart.map(c=>{total+=c.p*c.q;return `• ${c.n} x ${c.q} = Rs ${c.p*c.q}`;}).join('%0A');let msg=`Assalam-o-Alaikum Dough Dai!%0AFull Order:%0A${lines}%0ATotal: Rs ${total}%0AName:%0APhone:%0AAddress:`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');}
document.addEventListener('input',update);setTimeout(update,500);
</script>
</body>
</html>
