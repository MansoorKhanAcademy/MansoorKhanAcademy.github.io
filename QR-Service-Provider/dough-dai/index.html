<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dough Dai – Menu &amp; WhatsApp Orders | Dargai Bazar</title>
<meta name="description" content="Dough Dai, Tariq Market, Dargai Bazar. Pizza, burgers, wraps, chicken and more. delivery available. Order on WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1714;--muted:#6f655e;--line:#e8e2dc;--bg:#f7f4f0;--card:#fff;--red:#d3301f;--red-d:#b12517;--gold:#f4b223;--wa:#1faa59}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Header */
.hero{background:linear-gradient(160deg,#2a1b15,#1c1714 60%);color:#fff;text-align:center;padding:28px 16px 30px;border-bottom:5px solid var(--red)}
.logo{width:92px;height:92px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:grid;place-items:center;margin:0 auto 12px;overflow:hidden;font-size:44px}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--gold)}
.addr{margin-top:8px;font-size:14px;opacity:.8}
.info{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.pill.free{background:var(--gold);border-color:var(--gold);color:#1c1714}

/* Category nav */
.nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Menu */
main{max-width:760px;margin:0 auto;padding:4px 12px 150px}
section{padding-top:24px}
h2{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;margin-bottom:12px;letter-spacing:-.3px}
.grid{display:grid;gap:10px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-weight:700;font-size:16px}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.price{font-weight:700;color:var(--red);white-space:nowrap}
.item .row{align-items:flex-start}
.item .ctl{margin-top:12px}
.sizes{margin-top:10px;display:grid;gap:8px}
.size{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:10px}
.size .sz{font-weight:800;width:42px}
.size .price{flex:1}
.size.off{color:#a39a93;font-size:13px}
.size.off span:last-child{margin-left:auto}

/* Add / stepper */
.ctl{display:flex;justify-content:flex-end}
.add{background:var(--red);color:#fff;font-weight:700;font-size:14px;height:38px;padding:0 20px;border-radius:10px}
.add:hover{background:var(--red-d)}
.step{display:none;align-items:center;height:38px;border-radius:10px;background:var(--ink);color:#fff}
.step button{width:40px;height:100%;font-size:20px;font-weight:700}
.step b{min-width:28px;text-align:center;font-size:15px}
.ctl.on .step{display:flex}
.ctl.on .add{display:none}
.item .ctl{justify-content:flex-start}

footer{text-align:center;font-size:13px;color:var(--muted);padding:30px 16px 0}
footer a{font-weight:700}

/* Cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(247,244,240,.95) 30%);pointer-events:none}
.bar button{pointer-events:auto;display:none;width:100%;max-width:760px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;padding:14px 18px;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.bar.show button{display:flex}
.bar .l{text-align:left;font-weight:700}
.bar .l small{display:block;font-weight:400;opacity:.7;font-size:12px}
.bar .r{background:var(--gold);color:var(--ink);font-weight:800;padding:9px 16px;border-radius:10px;font-size:14px}

/* Sheet */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;max-width:640px;margin:0 auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet[hidden],.back[hidden]{display:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h3{font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.x{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:20px}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:15px}
.line .t span{font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:14px 0 4px}
.note{font-size:13px;color:var(--muted);margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--red);outline:none}
.err{border-color:var(--red)!important}
.msg{color:var(--red);font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.send{width:100%;margin-top:6px;background:var(--wa);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:12px}
.send:hover{filter:brightness(.95)}
.clear{display:block;margin:12px auto 0;color:var(--muted);font-size:14px;text-decoration:underline}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <div class="logo"><img src="logo.png" alt="Dough Dai logo" onerror="this.parentNode.textContent='🍕'"></div>
  <h1>Dough <em>Dai</em></h1>
  <p class="addr">Tariq Market, Adjacent PTCL Exchange, Dargai Bazar</p>
  <div class="info">
    <a class="pill" href="tel:+92932332665">📞 0932-332665</a>
    <a class="pill" href="tel:+923021591111">📱 0302-1591111</a>
    <span class="pill free">🚚 Delivery Available</span>
  </div>
</header>

<nav class="nav" aria-label="Menu categories"><div class="nav-in" id="nav"></div></nav>
<main id="menu"></main>

<footer>
  <p>Prices are in Pakistani rupees (Rs).</p>
  <p style="margin-top:4px">Questions? Call <a href="tel:+923021591111">0302-1591111</a></p>
</footer>

<div class="bar" id="bar"><button id="open" type="button"><span class="l"><span id="bc">0 items</span><small id="bs"></small></span><span class="r">View order</span></button></div>

<div class="back" id="back" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden>
  <div class="sh-head"><h3 id="shT">Your order</h3><button class="x" id="close" type="button" aria-label="Close">×</button></div>
  <div id="lines"></div>
  <div class="total"><span>Total</span><span id="tot">Rs 0</span></div>
  <p class="note">Delivery in Dargai. We confirm your order on WhatsApp.</p>
  <label for="fn">Your name</label><input id="fn" autocomplete="name" placeholder="e.g. Ahmad Khan">
  <label for="fp">Phone number</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="03xx-xxxxxxx">
  <label for="fa">Delivery address</label><textarea id="fa" rows="2" autocomplete="street-address" placeholder="House, street, area"></textarea>
  <label for="fo">Notes (optional)</label><input id="fo" placeholder="e.g. less spicy, extra sauce">
  <p class="msg" id="msg" role="alert"></p>
  <button class="send" id="send" type="button">Send order on WhatsApp</button>
  <button class="clear" id="clear" type="button">Clear order</button>
</div>

<script>
const WA="923021591111";
const MAXQ=20;

// Pizza: [name, 7", 10", 13"]  (null = not available)
const pizzas=[
["Dough Dai Special",650,1200,1800],["Chicken Tikka",550,1050,1500],["Chicken Fajita",550,1050,1500],
["Creamy Melt",600,1100,1600],["Beef Pepperoni",600,1150,1650],["Margherita",450,850,1350],
["Stuffed Crust",null,1200,1650],["Kebab Crust",null,1250,1700],["Crown Crust",null,1350,1750],["Calzone",null,1200,null]];
const SIZES=['7"','10"','13"'];

// Other categories: [name, description, price]
const menu=[
["Starters",[["Wings (6 pcs)","Crispy, Nashville, BBQ, Garlic Mayo or Special",450],["Bihari Roll","",350],["Loaded Fries","",450],["Fries","Add BBQ or Garlic +50, Special +70",150],["Soup Special","",350],["Chicken Corn Soup","",250]]],
["Burgers",[["Grill Burger","",420],["Crunch Classic","",450],["Crunch Nashville","",490],["Smash Burger","",600],["The Big Boss","",650]]],
["Wraps & Sandwiches",[["Grilled Wrap","",420],["Crispy Wrap","",450],["Crispy Sandwich","",500],["Jalapeño Sandwich","",500]]],
["Classics",[["Alfredo Pasta","",600],["Marinara Pasta","",600],["Mac & Cheese with Tenders","",650],["Fish & Chips","",850]]],
["Kids Menu",[["Kids Burger","",350],["Poppers","",350],["Wings (4 pcs)","",350]]],
["Chicken",[["Crispy Chicken 2 pcs","Classic or Nashville",450],["Crispy Chicken 4 pcs","",950],["Crispy Chicken 6 pcs","",1200],["Crispy Chicken 8 pcs","",1600],["Chicken Tenders 3 pcs","",450],["Chicken Tenders 6 pcs","",850]]],
["Add-ons",[["Pizza Topping 7\"","",150],["Pizza Topping 10\"","",200],["Pizza Topping 13\"","",300],["Smash Patty","",250],["Extra Cheese","",60],["Mushrooms","",60],["Grilled Onions","",50],["BBQ Sauce","",50],["Garlic Mayo","",50],["Special Sauce","",70]]]
];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'');
const items={}, cart={};
let n=0;
const reg=(name,price)=>{const id='i'+(++n);items[id]={name,price};return id};
const ctl=id=>`<div class="ctl" data-id="${id}"><button class="add" type="button" data-d="1">Add</button><div class="step"><button type="button" data-d="-1" aria-label="Remove one">−</button><b>0</b><button type="button" data-d="1" aria-label="Add one">+</button></div></div>`;

// Build menu
let html=`<section id="pizza"><h2>Pizza</h2><div class="grid">`;
pizzas.forEach(p=>{
  html+=`<div class="card"><div class="name">${esc(p[0])}</div><div class="sizes">`;
  SIZES.forEach((s,i)=>{
    const pr=p[i+1];
    if(pr){const id=reg(p[0]+' '+s,pr);html+=`<div class="size"><span class="sz">${s}</span><span class="price">Rs ${pr}</span>${ctl(id)}</div>`;}
    else html+=`<div class="size off"><span class="sz">${s}</span><span>Not available</span></div>`;
  });
  html+=`</div></div>`;
});
html+=`</div></section>`;
menu.forEach(([title,list])=>{
  html+=`<section id="${slug(title)}"><h2>${esc(title)}</h2><div class="grid two">`;
  list.forEach(([name,desc,price])=>{
    const id=reg(name,price);
    html+=`<div class="card item"><div class="row"><div><div class="name">${esc(name)}</div>${desc?`<div class="desc">${esc(desc)}</div>`:''}</div><div class="price">Rs ${price}</div></div>${ctl(id)}</div>`;
  });
  html+=`</div></section>`;
});
$('menu').innerHTML=html;
$('nav').innerHTML=[['Pizza','pizza'],...menu.map(m=>[m[0],slug(m[0])])].map(([t,s])=>`<a class="chip" href="#${s}" data-s="${s}">${esc(t)}</a>`).join('');

// Cart logic
function setQty(id,q){q=Math.max(0,Math.min(MAXQ,q));if(q)cart[id]=q;else delete cart[id];render();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-d]');if(!b)return;
  const id=b.closest('.ctl').dataset.id;setQty(id,(cart[id]||0)+Number(b.dataset.d));
});
const money=v=>'Rs '+v.toLocaleString('en-US');
function totals(){let c=0,t=0;for(const id in cart){c+=cart[id];t+=cart[id]*items[id].price}return{c,t}}
function render(){
  const {c,t}=totals(), ids=Object.keys(cart);
  // order sheet lines
  $('lines').innerHTML=ids.map(id=>`<div class="line"><div class="t"><b>${esc(items[id].name)}</b><span>${money(items[id].price)} each</span></div>${ctl(id)}</div>`).join('');
  document.querySelectorAll('.ctl').forEach(el=>{
    const q=cart[el.dataset.id]||0;el.classList.toggle('on',q>0);el.querySelector('b').textContent=q;
  });
  $('bar').classList.toggle('show',c>0);
  $('bc').textContent=c+(c===1?' item':' items');
  $('bs').textContent=ids.slice(0,2).map(i=>items[i].name+' ×'+cart[i]).join(', ')+(ids.length>2?' +'+(ids.length-2)+' more':'');
  document.querySelector('.bar .r').textContent=money(t)+' · View';
  $('tot').textContent=money(t);
  if(!c)closeSheet();
}
function openSheet(){$('sheet').hidden=false;$('back').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('sheet').hidden=true;$('back').hidden=true;document.body.style.overflow=''}
$('open').onclick=openSheet;$('close').onclick=closeSheet;$('back').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('clear').onclick=()=>{for(const k in cart)delete cart[k];render()};

// Remember customer details on this phone
const F=['fn','fp','fa','fo'];
try{F.forEach(f=>{const v=localStorage.getItem('dd_'+f);if(v)$(f).value=v})}catch(e){}
F.forEach(f=>$(f).addEventListener('input',()=>{$(f).classList.remove('err');try{localStorage.setItem('dd_'+f,$(f).value)}catch(e){}}));

// Send order
$('send').onclick=()=>{
  const {c,t}=totals();if(!c)return;
  const need=['fn','fp','fa'].filter(f=>!$(f).value.trim());
  F.forEach(f=>$(f).classList.toggle('err',need.includes(f)));
  if(need.length){$('msg').textContent='Please fill in your name, phone and address.';$(need[0]).focus();return}
  $('msg').textContent='';
  const lines=Object.keys(cart).map(id=>`• ${items[id].name} x ${cart[id]} = ${money(items[id].price*cart[id])}`).join('\n');
  let m=`Assalam-o-Alaikum Dough Dai!\n\n*New order*\n${lines}\n\n*Total: ${money(t)}*\n\nName: ${$('fn').value.trim()}\nPhone: ${$('fp').value.trim()}\nAddress: ${$('fa').value.trim()}`;
  if($('fo').value.trim())m+=`\nNotes: ${$('fo').value.trim()}`;
  const url=`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
  if(!window.open(url,'_blank'))location.href=url;
};

// Highlight the category being viewed
const chips=[...document.querySelectorAll('.chip')];
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){
  chips.forEach(ch=>ch.classList.toggle('on',ch.dataset.s===en.target.id));
  const on=document.querySelector('.chip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}})},{rootMargin:'-80px 0px -65% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));

render();
</script>
</body>
</html>
